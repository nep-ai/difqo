name: Railway staging

on:
  push:
    branches: [main]
    paths:
      - '.railway/**'
      - '.github/workflows/railway-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-staging
  cancel-in-progress: false

jobs:
  apply:
    name: Apply Railway staging configuration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Install Railway CLI and IaC SDK
        run: |
          npm install --prefix "$RUNNER_TEMP/railway-cli" --no-save --package-lock=false @railway/cli@5.75.0
          npm install --prefix .railway --no-save --package-lock=false railway@3.17.0
      - name: Plan and apply Railway staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
        run: |
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is missing from the GitHub staging environment"
              exit 1
            fi
          done

          railway="$RUNNER_TEMP/railway-cli/node_modules/.bin/railway"
          plan="$RUNNER_TEMP/railway-staging-plan.json"
          "$railway" config plan --environment "$RAILWAY_ENVIRONMENT_ID" --out "$plan"
          "$railway" config apply --environment "$RAILWAY_ENVIRONMENT_ID" --plan "$plan" --yes
