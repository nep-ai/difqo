name: Railway staging

on:
  push:
    branches: [main]
    paths:
      - '.railway/**'
      - '.github/workflows/railway-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-staging
  cancel-in-progress: false

jobs:
  apply:
    name: Apply Railway staging configuration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Install locked Railway IaC SDK
        run: npm ci --prefix .railway
      - name: Install verified Railway CLI
        working-directory: ${{ runner.temp }}
        run: |
          archive=railway-v5.75.0-x86_64-unknown-linux-gnu.tar.gz
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
            --output "$archive" "https://github.com/railwayapp/cli/releases/download/v5.75.0/$archive"
          printf '%s  %s\n' '28fca554b4862a1129d4976223e91ec828b9d402196a3ba823b83a7b06b6440e' "$archive" | sha256sum --check
          mkdir railway-cli
          tar -xzf "$archive" -C railway-cli railway
      - name: Plan and apply Railway staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
        run: |
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is missing from the GitHub staging environment"
              exit 1
            fi
          done

          railway="$RUNNER_TEMP/railway-cli/railway"
          plan="$RUNNER_TEMP/railway-staging-plan.json"
          result="$RUNNER_TEMP/railway-staging-apply.json"
          "$railway" config plan --environment "$RAILWAY_ENVIRONMENT_ID" --out "$plan"
          "$railway" config apply --environment "$RAILWAY_ENVIRONMENT_ID" --plan "$plan" --yes --json > "$result"
          if ! jq -e '
            ((.status == "applied" and (.changes | type) == "array") or .status == "noop")
            and all((.changes // [])[]; .status != "failed")
          ' "$result" >/dev/null; then
            echo "::error::Railway did not fully apply the staging configuration"
            exit 1
          fi
          echo "Railway staging configuration is up to date."
