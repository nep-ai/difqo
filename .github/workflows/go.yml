name: Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: difqo_smoke
          POSTGRES_PASSWORD: smoke-test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d difqo_smoke"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.11'

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/difqo ./cmd/difqo
      - run: go build -o bin/connections ./cmd/connections

      - name: Verify database setup and migration recovery
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres difqo_fresh
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres difqo_legacy
          export DIFQO_FRESH_DATABASE_URL="postgres://postgres:smoke-test@127.0.0.1:${POSTGRES_PORT}/difqo_fresh?sslmode=disable"
          export DIFQO_LEGACY_DATABASE_URL="postgres://postgres:smoke-test@127.0.0.1:${POSTGRES_PORT}/difqo_legacy?sslmode=disable"
          python3 scripts/database-setup-smoke.py bin/difqo migrations
          DIFQO_CHIEF_TEST_DATABASE_URL="$DIFQO_FRESH_DATABASE_URL" \
            go test -race -count=1 -run TestChiefConversationPersistsAndReusesContext ./internal/controlplane

      - name: Test Slack relay pairing and local delivery
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres difqo_relay_smoke
          for migration in relay/migrations/*.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d difqo_relay_smoke -v ON_ERROR_STOP=1 < "$migration"
          done
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres difqo_local_delivery_smoke
          for migration in migrations/*.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d difqo_local_delivery_smoke -v ON_ERROR_STOP=1 < "$migration"
          done
          DIFQO_SLACK_DELIVERY_TEST_DATABASE_URL="postgres://postgres:smoke-test@127.0.0.1:${POSTGRES_PORT}/difqo_local_delivery_smoke?sslmode=disable" \
          DIFQO_SLACK_RELAY_TEST_DATABASE_URL="postgres://postgres:smoke-test@127.0.0.1:${POSTGRES_PORT}/difqo_relay_smoke?sslmode=disable" \
            go test -race -count=1 ./internal/slackrelay ./internal/slackintake
          DIFQO_SLACK_RELAY_TEST_DATABASE_URL="postgres://postgres:smoke-test@127.0.0.1:${POSTGRES_PORT}/difqo_relay_smoke?sslmode=disable" \
            python3 scripts/connections-smoke.py bin/connections
          DIFQO_SLACK_RELAY_TEST_DATABASE_URL="postgresql:///difqo_relay_smoke?host=127.0.0.1&port=${POSTGRES_PORT}&user=postgres&password=smoke-test&sslmode=disable" \
            python3 scripts/slack-staging-smoke.py

      - name: Rehearse the Railway Connections container
        run: |
          docker build -t difqo-connections:smoke -f containers/connections/Dockerfile .
          python3 scripts/connections-container-smoke.py difqo-connections:smoke

      - name: Build Codex execution and smoke images
        run: |
          docker build -t difqo-codex:0.171.0 containers/codex
          docker build -t difqo-codex-smoke -f scripts/fixtures/Dockerfile.codex-smoke scripts/fixtures

      - name: Smoke test against PostgreSQL
        env:
          DIFQO_SMOKE_CODEX: '1'
          DIFQO_SMOKE_CONTAINER_RUNTIME: ${{ github.workspace }}/scripts/fixtures/docker-codex-smoke
          DIFQO_SMOKE_DOCKER_SECCOMP: ${{ runner.temp }}/difqo-seccomp.json
          DIFQO_SMOKE_DOCKER_APPARMOR: difqo-codex-smoke
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          # Keep Docker's default syscall filter and add the calls bubblewrap
          # needs. The extra clone rule requires CLONE_NEWUSER (0x10000000).
          curl -fsSL https://raw.githubusercontent.com/moby/profiles/a0fa70805f742f7da15b367770d802ea2a86c68b/seccomp/default.json \
            | jq '.syscalls += [
                {"names":["unshare","mount","umount2","pivot_root"],"action":"SCMP_ACT_ALLOW"},
                {"names":["clone"],"action":"SCMP_ACT_ALLOW","args":[
                  {"index":0,"value":268435456,"valueTwo":268435456,"op":"SCMP_CMP_MASKED_EQ"}
                ]}
              ]' > "$DIFQO_SMOKE_DOCKER_SECCOMP"
          # The disposable Ubuntu runner restricts user namespaces through
          # AppArmor. Grant the exception only to synthetic Codex containers.
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            sudo apparmor_parser -r <<'PROFILE'
          abi <abi/4.0>,
          profile difqo-codex-smoke flags=(unconfined) {
              userns,
          }
          PROFILE
          else
            unset DIFQO_SMOKE_DOCKER_APPARMOR
          fi
          for migration in migrations/*.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d difqo_smoke -v ON_ERROR_STOP=1 < "$migration"
          done
          export DIFQO_DATABASE_URL="postgres://postgres:smoke-test@127.0.0.1:${POSTGRES_PORT}/difqo_smoke?sslmode=disable"
          python3 scripts/postgres-smoke.py bin/difqo
          python3 scripts/slack-connection-smoke.py bin/difqo
          DIFQO_SLACK_TEST_DATABASE_URL="$DIFQO_DATABASE_URL" go test -count=1 ./internal/store
          DIFQO_GITHUB_TEST_DATABASE_URL="$DIFQO_DATABASE_URL" go test -count=1 ./internal/githubintake
