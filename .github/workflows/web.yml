name: Web CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: corepack pnpm@10.34.9 install --frozen-lockfile
      - run: corepack pnpm@10.34.9 --filter difqo-local-ui build

  macos-package:
    name: macOS release package
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.11'
      - run: corepack pnpm@10.34.9 install --frozen-lockfile
      - run: corepack pnpm@10.34.9 --filter difqo-local-ui build
      - name: Verify the Apple silicon bundle
        run: |
          bundle=$(bash scripts/package-macos.sh v0.0.0-ci "$RUNNER_TEMP")
          cd "$bundle"
          shasum -a 256 -c SHA256SUMS
          mkdir extracted
          tar -xzf difqo-v0.0.0-ci-darwin-arm64.tar.gz -C extracted
          file extracted/bin/difqo | cut -d: -f2- | grep -E 'Mach-O .*arm64'
          test -x extracted/bin/difqo
          test -f extracted/web/index.html
          diff -r "$GITHUB_WORKSPACE/web/dist" extracted/web
          for migration in "$GITHUB_WORKSPACE"/migrations/*.sql; do
            cmp "$migration" "extracted/migrations/$(basename "$migration")"
          done
          test "$(cat extracted/VERSION)" = v0.0.0-ci
